name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Descargar el MDK oficial de Forge 1.20.1
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Copiar el mod dentro del MDK
        run: |
          rm -rf mdk/src
          cp -r src mdk/src
          cp gradle.properties mdk/gradle.properties

      - name: Compilar
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: mdk/build/libs/*.jar
